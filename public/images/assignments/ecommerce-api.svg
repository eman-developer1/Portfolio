<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#apiGrad)" />
  <rect x="40" y="35" width="720" height="50" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="70" cy="60" r="6" fill="#ef4444" />
  <circle cx="90" cy="60" r="6" fill="#eab308" />
  <circle cx="110" cy="60" r="6" fill="#22c55e" />
  <text x="140" y="65" fill="#f8fafc" font-family="monospace" font-size="13">POST /api/v1/auth/login • 200 OK</text>

  <rect x="40" y="110" width="720" height="350" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="70" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">E-Commerce REST API Architecture</text>
  <text x="70" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">JWT Bearer Authentication • Role-based routes • Supabase PostgreSQL</text>

  <rect x="70" y="210" width="310" height="210" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.06)" />
  <text x="90" y="240" fill="#a855f7" font-family="monospace" font-size="12">// Endpoints Handled</text>
  <text x="90" y="270" fill="#34d399" font-family="monospace" font-size="12">POST /auth/register</text>
  <text x="90" y="300" fill="#34d399" font-family="monospace" font-size="12">GET  /products?page=1</text>
  <text x="90" y="330" fill="#34d399" font-family="monospace" font-size="12">POST /cart/items</text>
  <text x="90" y="360" fill="#34d399" font-family="monospace" font-size="12">POST /checkout/session</text>

  <rect x="410" y="210" width="310" height="210" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.06)" />
  <text x="430" y="240" fill="#38bdf8" font-family="monospace" font-size="12">{</text>
  <text x="450" y="270" fill="#cbd5e1" font-family="monospace" font-size="12">"status": "success",</text>
  <text x="450" y="300" fill="#cbd5e1" font-family="monospace" font-size="12">"token": "eyJhbGciOi...",</text>
  <text x="450" y="330" fill="#cbd5e1" font-family="monospace" font-size="12">"role": "customer"</text>
  <text x="430" y="360" fill="#38bdf8" font-family="monospace" font-size="12">}</text>
</svg>
