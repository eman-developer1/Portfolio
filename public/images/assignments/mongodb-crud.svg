<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06201b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#mongoGrad)" />
  <rect x="40" y="35" width="720" height="50" rx="10" fill="rgba(6, 40, 32, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="70" cy="60" r="6" fill="#ef4444" />
  <circle cx="90" cy="60" r="6" fill="#eab308" />
  <circle cx="110" cy="60" r="6" fill="#22c55e" />
  <text x="140" y="65" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">MongoDB Aggregation Pipeline Lab</text>

  <rect x="40" y="115" width="720" height="340" rx="12" fill="rgba(9, 13, 22, 0.9)" stroke="rgba(255,255,255,0.08)" />
  <text x="70" y="155" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Pipeline Stages: $match → $group → $sort → $project</text>
  
  <rect x="70" y="180" width="660" height="240" rx="8" fill="#0c1815" stroke="rgba(52, 211, 153, 0.2)" />
  <text x="95" y="215" fill="#f59e0b" font-family="monospace" font-size="12">db.orders.aggregate([</text>
  <text x="115" y="245" fill="#94a3b8" font-family="monospace" font-size="12">{ $match: { status: <tspan fill="#34d399">"completed"</tspan> } },</text>
  <text x="115" y="275" fill="#94a3b8" font-family="monospace" font-size="12">{ $group: { _id: <tspan fill="#34d399">"$customerId"</tspan>, totalSpent: { $sum: <tspan fill="#34d399">"$amount"</tspan> } } },</text>
  <text x="115" y="305" fill="#94a3b8" font-family="monospace" font-size="12">{ $sort: { totalSpent: -1 } },</text>
  <text x="115" y="335" fill="#94a3b8" font-family="monospace" font-size="12">{ $limit: 10 }</text>
  <text x="95" y="365" fill="#f59e0b" font-family="monospace" font-size="12">]);</text>
  <text x="95" y="395" fill="#22c55e" font-family="monospace" font-size="12">// Executed in 12ms — Index Scan</text>
</svg>
