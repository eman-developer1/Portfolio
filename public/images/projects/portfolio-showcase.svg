  <rect x="80" y="285" width="640" height="160" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="100" cy="305" r="5" fill="#ef4444" />
  <circle cx="116" cy="305" r="5" fill="#eab308" />
  <circle cx="132" cy="305" r="5" fill="#22c55e" />
