  <rect width="800" height="500" rx="16" fill="url(#pBg)" />
  
  <rect x="40" y="30" width="720" height="440" rx="12" fill="rgba(24, 24, 42, 0.7)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1" />
  
