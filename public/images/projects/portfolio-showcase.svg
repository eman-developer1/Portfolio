  <text x="120" y="362" fill="#94a3b8" font-family="monospace" font-size="12">name: <tspan fill="#a7f3d0">'Eman Khan'</tspan>, stack: [<tspan fill="#fde047">'Next.js'</tspan>, <tspan fill="#fde047">'React'</tspan>, <tspan fill="#fde047">'TypeScript'</tspan>, <tspan fill="#fde047">'Supabase'</tspan>],</text>
