  <text x="110" y="137" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WEB DEVELOPER</text>

  <text x="80" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Hi, I'm Eman Khan.</text>
  <text x="80" y="225" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">I Build Modern Digital Experiences.</text>
  <text x="80" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Focused on responsive, interactive and user-friendly web applications.</text>

