<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f1f38" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#carBgGrad)" />

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="54" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="70" cy="57" r="6" fill="#ef4444" />
  <circle cx="90" cy="57" r="6" fill="#eab308" />
  <circle cx="110" cy="57" r="6" fill="#22c55e" />
  <rect x="140" y="44" width="240" height="26" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="155" y="61" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">VIN: 1HGCR2F83HA09412 • Verified</text>
  <rect x="635" y="42" width="110" height="30" rx="6" fill="url(#cyanGrad)" />
  <text x="690" y="61" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Export PDF</text>

  <!-- Left Main Vehicle Summary -->
  <rect x="40" y="100" width="460" height="365" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <text x="65" y="135" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">VEHICLE HISTORY REPORT</text>
  <text x="65" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">2023 Audi RS6 Avant Quattro</text>
  <text x="65" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Clean Title • 1 Owner • Full Dealer Service Records</text>

  <!-- Spec Badges -->
  <rect x="65" y="210" width="120" height="60" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
  <text x="77" y="232" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Mileage</text>
  <text x="77" y="255" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">14,820 mi</text>

  <rect x="200" y="210" width="120" height="60" rx="8" fill="rgba(34, 197, 94, 0.1)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
  <text x="212" y="232" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accidents</text>
  <text x="212" y="255" fill="#4ade80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">0 Reported</text>

  <rect x="335" y="210" width="140" height="60" rx="8" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
  <text x="347" y="232" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Score Index</text>
  <text x="347" y="255" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">98 / 100</text>

  <!-- Inspection Timeline -->
  <text x="65" y="305" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Verified Event Log</text>
  <circle cx="75" cy="335" r="5" fill="#22c55e" />
  <line x1="75" y1="340" x2="75" y2="425" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <text x="95" y="339" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Passed Multi-point Safety Inspection</text>
  <text x="95" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Audi Certified Pre-Owned Center • 12,500 mi</text>

  <circle cx="75" cy="385" r="5" fill="#38bdf8" />
  <text x="95" y="389" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Oil & Filter Changed, Brake Fluid Flushed</text>
  <text x="95" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Service Center Northwest • 8,900 mi</text>

  <!-- Right Inspection / Diagnostic Panel -->
  <rect x="520" y="100" width="240" height="365" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="540" y="135" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Component Health</text>
  
  <text x="540" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Engine & Transmission</text>
  <rect x="540" y="180" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="540" y="180" width="195" height="8" rx="4" fill="#22c55e" />

  <text x="540" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Brake Pads (8.5mm)</text>
  <rect x="540" y="225" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="540" y="225" width="180" height="8" rx="4" fill="#22c55e" />

  <text x="540" y="260" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Tire Tread Depth</text>
  <rect x="540" y="270" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="540" y="270" width="170" height="8" rx="4" fill="#38bdf8" />

  <text x="540" y="305" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Electrical & Sensors</text>
  <rect x="540" y="315" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="540" y="315" width="195" height="8" rx="4" fill="#22c55e" />

  <rect x="540" y="360" width="200" height="85" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1" />
  <text x="555" y="385" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SUPABASE REALTIME</text>
  <text x="555" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">All data synchronized via</text>
  <text x="555" y="423" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">PostgreSQL cloud storage</text>
</svg>
