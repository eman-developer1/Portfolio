<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Top App Bar -->
  <rect x="40" y="35" width="720" height="50" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="70" cy="60" r="6" fill="#ef4444" />
  <circle cx="90" cy="60" r="6" fill="#eab308" />
  <circle cx="110" cy="60" r="6" fill="#22c55e" />
  <rect x="140" y="50" width="220" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="150" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">restaurant-pos.app/dashboard</text>
  <rect x="650" y="47" width="90" height="26" rx="6" fill="url(#accentGrad)" />
  <text x="695" y="64" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live Order</text>

  <!-- Left Sidebar / Menu Column -->
  <rect x="40" y="105" width="200" height="360" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="60" y="135" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Menu Categories</text>
  
  <rect x="55" y="150" width="170" height="32" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1" />
  <text x="75" y="171" fill="#fb923c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🍔 Main Courses (18)</text>

  <rect x="55" y="195" width="170" height="32" rx="6" fill="rgba(255,255,255,0.03)" />
  <text x="75" y="216" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🥗 Appetizers (12)</text>

  <rect x="55" y="240" width="170" height="32" rx="6" fill="rgba(255,255,255,0.03)" />
  <text x="75" y="261" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🍕 Woodfired Pizzas (8)</text>

  <rect x="55" y="285" width="170" height="32" rx="6" fill="rgba(255,255,255,0.03)" />
  <text x="75" y="306" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🍹 Beverages & Wine</text>

  <rect x="55" y="415" width="170" height="34" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1" />
  <text x="140" y="437" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kitchen Stream: Online</text>

  <!-- Right Dashboard Content -->
  <!-- Stats row -->
  <rect x="260" y="105" width="150" height="80" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="275" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Today's Revenue</text>
  <text x="275" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">$3,480.50</text>

  <rect x="425" y="105" width="150" height="80" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="440" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Active Tables</text>
  <text x="440" y="160" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">24 / 28</text>

  <rect x="590" y="105" width="170" height="80" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="605" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Orders in Queue</text>
  <text x="605" y="160" fill="#4ade80" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">12 Orders</text>

  <!-- Main Order Table / Cards -->
  <rect x="260" y="200" width="500" height="265" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="280" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Live Orders Management</text>
  
  <!-- Order row 1 -->
  <rect x="280" y="250" width="460" height="50" rx="8" fill="rgba(255,255,255,0.03)" />
  <text x="300" y="280" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table #04 - Truffle Burger x2, Hand-cut Fries</text>
  <rect x="660" y="262" width="65" height="24" rx="4" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" stroke-width="1" />
  <text x="692" y="278" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cooking</text>

  <!-- Order row 2 -->
  <rect x="280" y="312" width="460" height="50" rx="8" fill="rgba(255,255,255,0.03)" />
  <text x="300" y="342" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table #11 - Margherita Pizza, Caesar Salad</text>
  <rect x="660" y="324" width="65" height="24" rx="4" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1" />
  <text x="692" y="340" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ready</text>

  <!-- Order row 3 -->
  <rect x="280" y="374" width="460" height="50" rx="8" fill="rgba(255,255,255,0.03)" />
  <text x="300" y="404" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table #02 - Ribeye Steak Medium, Red Wine</text>
  <rect x="660" y="386" width="65" height="24" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1" />
  <text x="692" y="402" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Served</text>
</svg>
