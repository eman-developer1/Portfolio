<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Certificate background -->
  <rect width="800" height="560" rx="16" fill="#0c1222" />
  
  <!-- Guilloche / Border Frame -->
  <rect x="25" y="25" width="750" height="510" rx="12" fill="none" stroke="url(#certBorderGrad)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="490" rx="8" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Header badge -->
  <circle cx="400" cy="90" r="28" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="2" />
  <path d="M390 90 L397 97 L412 82" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <text x="400" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="400" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Modern Next.js &amp; React Full-Stack Architecture</text>
  
  <text x="400" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">This credential certifies that</text>
  
  <!-- Recipient name -->
  <text x="400" y="265" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">Eman Khan</text>
  <line x1="250" y1="285" x2="550" y2="285" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />

  <text x="400" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">has demonstrated professional competency in Next.js App Router, React Server Components,</text>
  <text x="400" y="348" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">TypeScript engineering, and scalable full-stack web application deployment.</text>

  <!-- Gold Seal -->
  <circle cx="160" cy="440" r="35" fill="url(#sealGold)" opacity="0.9" />
  <circle cx="160" cy="440" r="28" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4,2" />
  <text x="160" y="445" fill="#78350f" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VERIFIED</text>

  <!-- Details block -->
  <text x="400" y="425" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ISSUED BY</text>
  <text x="400" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Professional Developer Training</text>
  <text x="400" y="465" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Credential ID: CERT-EK-98241 • Year: 2025</text>

  <!-- Signature line -->
  <line x1="600" y1="445" x2="720" y2="445" stroke="#64748b" stroke-width="1" />
  <path d="M610 435 Q640 415 670 435 T710 430" fill="none" stroke="#60a5fa" stroke-width="2" />
  <text x="660" y="465" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Lead Evaluator</text>
</svg>
